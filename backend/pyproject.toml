[tool.poetry]
name = "theo-cad"
version = "0.1.0"
description = "Production-grade agentic CAD platform for natural language to 3D model conversion"
authors = ["Theo CAD Team"]
readme = "README.md"
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.109.2"
uvicorn = {version = "0.27.1", extras = ["standard"]}
anthropic = "0.25.1"
sqlalchemy = "2.0.27"
asyncpg = "0.29.0"
alembic = "1.13.1"
redis = "5.0.1"
celery = "5.3.6"
pydantic = "2.6.1"
pydantic-settings = "2.1.0"
python-jose = {version = "3.3.0", extras = ["cryptography"]}
passlib = {version = "1.7.4", extras = ["bcrypt"]}
python-dotenv = "1.0.1"
httpx = "0.26.0"
structlog = "24.1.0"
trimesh = "4.1.4"
numpy = "1.26.4"
cadquery = "2.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.1.0"
mypy = "^1.8.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"
